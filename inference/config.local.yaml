# 本地开发配置（无 Docker 时使用）
# 用法：在仓库根目录执行
#   CONFIG_PATH=inference/config.local.yaml uv run python -m inference.main
# 路径均为相对仓库根目录（python -m inference.main 的 cwd 必须是仓库根目录）
# 与 config.yaml 的差异：backend_url 指向本机后端、抓拍目录改本地相对路径

backend_url: "http://localhost:8000"

model_path: "weights/ppe/ppe.pt"

class_names:
  0: Hardhat
  1: Mask
  2: NO-Hardhat
  3: NO-Mask
  4: NO-Safety Vest
  5: Person
  6: Safety Cone
  7: Safety Vest
  8: machinery
  9: vehicle

judge_mode: direct

violation_rule:
  no_helmet: NO-Hardhat
  no_vest: NO-Safety Vest
  no_mask: NO-Mask

conf_threshold: 0.5
dedup_seconds: 30
infer_every_n_frames: 5
device: cpu

# ---------- 火源火灾检测（第二模型，与 PPE 模型并行推理）----------
# 全部启用摄像头同时进行 PPE 与火源检测；关闭可设 fire_enabled: false
fire_enabled: true
# 火源/烟雾模型权重（YOLOv8n，2 类：0=smoke 1=fire）
fire_model_path: "weights/fire/fire.pt"
fire_class_names:
  0: smoke
  1: fire
fire_violation_rule:
  fire: fire
  smoke: smoke
fire_conf_threshold: 0.4

# 抓拍图片本地缓存目录（后端入库时还会保存一份到后端 UPLOAD_DIR）
save_dir: "./images"
