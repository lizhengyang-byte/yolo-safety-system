version: "3.8"

services:
  # 鏁版嵁搴?
  mysql:
    image: mysql:8.0
    container_name: yolo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: yolo123456
      MYSQL_DATABASE: yolo_safety
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pyolo123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 娴佸獟浣撹浆鍙戞湇鍔★紙RTSP -> FLV/WebRTC锛屼緵鍓嶇棰勮锛?
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: yolo-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP 杈撳叆绔彛
      - "8080:8080"   # HTTP / FLV / HLS 杈撳嚭绔彛
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml

  # FastAPI 鍚庣
  backend:
    build: ./backend
    container_name: yolo-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+pymysql://root:yolo123456@mysql:3306/yolo_safety?charset=utf8mb4"
      UPLOAD_DIR: "/data/images"
      # 棰勮閭欢锛堝彲閫夛紝鐣欑┖鍒欒嚜鍔ㄨ烦杩囧彂閫侊級
      MAIL_ENABLED: "${MAIL_ENABLED:-true}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_SSL: "${SMTP_SSL:-true}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_TO: "${MAIL_TO:-}"
    ports:
      - "8000:8000"
    volumes:
      - image_data:/data/images
      - ./weights:/app/weights:ro   # 婕旂ず妯″紡澶嶇敤鍚屼竴妯″瀷鏉冮噸
    depends_on:
      mysql:
        condition: service_healthy

  # YOLO 鎺ㄧ悊鏈嶅姟锛圧TSP 鎷夋祦 + 妫€娴?+ 鎶撴媿涓婃姤锛?
  inference:
    build: ./inference
    container_name: yolo-inference
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all   # GPU 鍙€夛紝鍘绘帀鍒欑敤 CPU
    volumes:
      - ./weights:/app/weights
      - ./inference/config.yaml:/app/config.yaml:ro
      - image_data:/data/images
    depends_on:
      - backend
    # 濡傛棤 GPU 鍙Щ闄や笅闈袱琛?
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 鍓嶇锛圢ginx 鎵樼 + 鍙嶄唬鍚庣锛?
  frontend:
    build: ./frontend
    container_name: yolo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  image_data:
